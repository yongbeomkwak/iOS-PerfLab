<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="-apple-system, 'Apple SD Gothic Neo', Helvetica, sans-serif">
<rect width="760" height="480" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="600" fill="#1c1c1e">입력 한 번은 어디서 처리되나</text>
<text x="20" y="56" font-size="13" fill="#6e6e73">가로축은 시간이다. 입력은 100ms마다 온다. 막대 길이는 설명용이고 측정값이 아니다.</text>
<rect x="436" y="24" width="12" height="12" fill="#3478f6"/><text x="454" y="35" font-size="13" fill="#1c1c1e">메인 스레드</text>
<rect x="536" y="24" width="12" height="12" fill="#ff9500"/><text x="554" y="35" font-size="13" fill="#1c1c1e">백그라운드</text>
<rect x="636" y="24" width="12" height="12" fill="#c7c7cc"/><text x="654" y="35" font-size="13" fill="#1c1c1e">취소된 검색</text>

<line x1="200" y1="92" x2="200" y2="180" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="440" y1="92" x2="440" y2="180" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="224" x2="200" y2="300" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="440" y1="224" x2="440" y2="300" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="344" x2="200" y2="420" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="440" y1="344" x2="440" y2="420" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 4"/>
<text x="200" y="84" font-size="13" fill="#1c1c1e" text-anchor="middle">입력 ①</text>
<text x="440" y="84" font-size="13" fill="#1c1c1e" text-anchor="middle">입력 ②</text>

<text x="20" y="122" font-size="15" font-weight="600" fill="#1c1c1e">Stage 0</text>
<text x="184" y="129" font-size="12" fill="#6e6e73" text-anchor="end">메인</text>
<text x="184" y="167" font-size="12" fill="#6e6e73" text-anchor="end">백그라운드</text>
<rect x="190" y="110" width="550" height="28" fill="#f2f2f7"/>
<rect x="190" y="148" width="550" height="28" fill="#f2f2f7"/>
<rect x="200" y="110" width="170" height="28" fill="#3478f6"/>
<text x="285" y="129" font-size="13" fill="#ffffff" text-anchor="middle">5만 개 거르기</text>
<rect x="440" y="110" width="170" height="28" fill="#3478f6"/>
<text x="525" y="129" font-size="13" fill="#ffffff" text-anchor="middle">5만 개 거르기</text>
<text x="200" y="167" font-size="12" fill="#8e8e93" dx="8">쓰지 않는다</text>
<text x="190" y="196" font-size="13" fill="#1c1c1e">거르는 동안 메인 스레드가 막혀 글자 표시와 그리기가 밀린다.</text>

<text x="20" y="242" font-size="15" font-weight="600" fill="#1c1c1e">Stage 1</text>
<text x="184" y="249" font-size="12" fill="#6e6e73" text-anchor="end">메인</text>
<text x="184" y="287" font-size="12" fill="#6e6e73" text-anchor="end">백그라운드</text>
<rect x="190" y="230" width="550" height="28" fill="#f2f2f7"/>
<rect x="190" y="268" width="550" height="28" fill="#f2f2f7"/>
<rect x="200" y="230" width="12" height="28" fill="#3478f6"/>
<rect x="440" y="230" width="12" height="28" fill="#3478f6"/>
<rect x="640" y="230" width="20" height="28" fill="#3478f6"/>
<text x="666" y="249" font-size="12" fill="#1c1c1e">결과 적용</text>
<rect x="212" y="268" width="228" height="28" fill="#c7c7cc"/>
<text x="326" y="287" font-size="13" fill="#1c1c1e" text-anchor="middle">검색 (끝나기 전에 취소)</text>
<rect x="452" y="268" width="188" height="28" fill="#ff9500"/>
<text x="546" y="287" font-size="13" fill="#ffffff" text-anchor="middle">검색 (거르기 + 위치 계산)</text>
<text x="190" y="316" font-size="13" fill="#1c1c1e">메인은 입력을 받고 결과를 적용하기만 한다. 검색이 끝나기 전에 다음 입력이 오면 버린다.</text>

<text x="20" y="362" font-size="15" font-weight="600" fill="#1c1c1e">Stage 2</text>
<text x="184" y="369" font-size="12" fill="#6e6e73" text-anchor="end">메인</text>
<text x="184" y="407" font-size="12" fill="#6e6e73" text-anchor="end">백그라운드</text>
<rect x="190" y="350" width="550" height="28" fill="#f2f2f7"/>
<rect x="190" y="388" width="550" height="28" fill="#f2f2f7"/>
<rect x="200" y="350" width="12" height="28" fill="#3478f6"/>
<rect x="232" y="350" width="20" height="28" fill="#3478f6"/>
<text x="258" y="369" font-size="12" fill="#1c1c1e">결과 적용</text>
<rect x="212" y="388" width="20" height="28" fill="#ff9500"/>
<text x="238" y="407" font-size="12" fill="#1c1c1e">인덱스에서 거르기</text>
<rect x="440" y="350" width="12" height="28" fill="#3478f6"/>
<rect x="472" y="350" width="20" height="28" fill="#3478f6"/>
<rect x="452" y="388" width="20" height="28" fill="#ff9500"/>
<text x="190" y="436" font-size="13" fill="#1c1c1e">미리 만든 인덱스에서 거르므로 다음 입력이 오기 훨씬 전에 끝난다. 버리는 검색이 없다.</text>
</svg>
